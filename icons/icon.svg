<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#25213a"/>
      <stop offset="0.55" stop-color="#121019"/>
      <stop offset="1" stop-color="#07070b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b7cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5b7cff" stop-opacity="0"/>
    </radialGradient>
    <!-- glass bodies -->
    <linearGradient id="glassA" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ffd59a" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#ff9a5a" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ff5e7a" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="glassB" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#c9f0ff" stop-opacity="0.88"/>
      <stop offset="0.5" stop-color="#7fa8ff" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#9a6bff" stop-opacity="0.5"/>
    </linearGradient>
    <!-- rim light: bright top-left, faint bottom-right, a second kick at bottom -->
    <linearGradient id="rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.38" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="caustic" cx="0.6" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="cA"><circle cx="200" cy="256" r="122"/></clipPath>
    <clipPath id="cB"><circle cx="312" cy="256" r="122"/></clipPath>
    <clipPath id="tile"><rect width="512" height="512" rx="114"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="150" cy="190" r="190" fill="url(#glowA)" filter="url(#soft)"/>
    <circle cx="380" cy="340" r="200" fill="url(#glowB)" filter="url(#soft)"/>

    <!-- shadows under the glass -->
    <ellipse cx="200" cy="392" rx="100" ry="18" fill="#000" opacity="0.55" filter="url(#shadow)"/>
    <ellipse cx="312" cy="392" rx="100" ry="18" fill="#000" opacity="0.55" filter="url(#shadow)"/>

    <!-- glass discs; the overlap is lit like a double exposure -->
    <circle cx="200" cy="256" r="122" fill="url(#glassA)"/>
    <circle cx="312" cy="256" r="122" fill="url(#glassB)" style="mix-blend-mode:screen"/>
    <g clip-path="url(#cA)">
      <circle cx="312" cy="256" r="122" fill="#fff" opacity="0.12"/>
    </g>

    <!-- inner sheen and bottom caustic -->
    <circle cx="200" cy="256" r="122" fill="url(#sheen)"/>
    <circle cx="312" cy="256" r="122" fill="url(#sheen)"/>
    <circle cx="200" cy="256" r="122" fill="url(#caustic)"/>
    <circle cx="312" cy="256" r="122" fill="url(#caustic)"/>

    <!-- specular streaks -->
    <g clip-path="url(#cA)"><path d="M118 214 A 96 96 0 0 1 176 152" stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.75" filter="url(#blur3)"/></g>
    <g clip-path="url(#cB)"><path d="M230 214 A 96 96 0 0 1 288 152" stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.75" filter="url(#blur3)"/></g>

    <!-- rims -->
    <circle cx="200" cy="256" r="120.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
    <circle cx="312" cy="256" r="120.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

    <!-- tile edge highlight -->
    <rect x="1" y="1" width="510" height="510" rx="113" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="2"/>
  </g>
</svg>
