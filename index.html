<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Feeltr — плёночный дневник</title>
  <meta name="description" content="Фотодневник с плёночными фильтрами Nostalgic Neg., Monochrome +R и мультиэкспозицией.">
  <meta name="theme-color" content="#11100e">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Feeltr">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <!-- Camera -->
  <main id="camera" class="screen camera">
    <header class="cam-top">
      <button id="btnFormat" class="pill mono" aria-label="Формат кадра">3:4</button>
      <div id="counter" class="counter mono">FEELTR</div>
      <div class="cam-top-right">
        <button id="btnImport" class="icon-btn" aria-label="Взять фото из галереи">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 2.5-2.5L20 17"/></svg>
        </button>
        <button id="btnFlip" class="icon-btn" aria-label="Сменить камеру">
          <svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3v10H4z"/><path d="M9.2 13a3 3 0 0 1 5.3-1.7M14.8 13.4a3 3 0 0 1-5.3 1.6"/><path d="M14.7 9.8v1.7h-1.7M9.3 16.6v-1.7H11"/></svg>
        </button>
      </div>
    </header>

    <section id="viewfinder" class="viewfinder">
      <div class="frame" id="frame">
        <canvas id="preview"></canvas>
        <div class="marks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div id="mxBadge" class="mx-badge mono" hidden>ME 1/2</div>
        <button id="stillChip" class="still-chip" hidden>Фото из галереи <span aria-hidden="true">✕</span></button>
        <div id="flash" class="flash"></div>
      </div>
      <div id="vfMessage" class="vf-message" hidden>
        <p id="vfText">Нужен доступ к камере</p>
        <div class="vf-actions">
          <button id="vfRetry" class="btn">Разрешить камеру</button>
          <button id="vfImport" class="btn ghost">Выбрать фото</button>
        </div>
      </div>
      <video id="video" playsinline muted autoplay></video>
    </section>

    <section id="mxPanel" class="mx-panel" hidden>
      <div class="segmented" role="radiogroup" aria-label="Режим совмещения">
        <button data-mode="0" role="radio">Плёнка</button>
        <button data-mode="1" role="radio">Экран</button>
        <button data-mode="2" role="radio">Светлее</button>
      </div>
      <label class="mix">
        <span class="mono">I</span>
        <input id="mixRange" type="range" min="10" max="90" step="1" value="50" aria-label="Баланс экспозиций">
        <span class="mono">II</span>
      </label>
      <button id="mxReset" class="link-btn" hidden>Сбросить первый кадр</button>
    </section>

    <section class="filters" role="radiogroup" aria-label="Плёнка">
      <button class="filter-chip" data-filter="nn" role="radio"><span class="swatch nn"></span>Nostalgic Neg.</button>
      <button class="filter-chip" data-filter="mono" role="radio"><span class="swatch mono-sw"></span>Mono +R</button>
    </section>

    <footer class="cam-bottom">
      <button id="btnDiary" class="thumb-btn" aria-label="Открыть дневник">
        <img id="lastThumb" alt="" hidden>
        <svg viewBox="0 0 24 24" id="diaryIcon"><path d="M6 4h11a1 1 0 0 1 1 1v15H7a1 1 0 0 1-1-1z"/><path d="M6 17.5h12M9.5 8h5"/></svg>
      </button>
      <button id="shutter" class="shutter" aria-label="Снять"><span></span></button>
      <button id="btnMx" class="mx-btn" aria-pressed="false" aria-label="Мультиэкспозиция">
        <svg viewBox="0 0 32 24"><circle cx="12" cy="12" r="7"/><circle cx="20" cy="12" r="7"/></svg>
        <small class="mono">MX</small>
      </button>
    </footer>
    <input id="fileInput" type="file" accept="image/*" hidden>
  </main>

  <!-- Diary -->
  <section id="diary" class="screen diary" hidden>
    <header class="diary-top">
      <button id="diaryBack" class="back-btn" aria-label="К камере">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="diary-title">
        <h1>Дневник</h1>
        <p id="diaryCount" class="mono"></p>
      </div>
      <button id="btnInstall" class="btn small" hidden>Установить</button>
    </header>
    <div id="iosTip" class="tip" hidden>
      Чтобы установить Feeltr: «Поделиться» → «На экран „Домой“».
      <button id="iosTipClose" aria-label="Закрыть">✕</button>
    </div>
    <div id="diaryList" class="diary-list"></div>
    <div id="diaryEmpty" class="empty" hidden>
      <p>Здесь будут ваши кадры.</p>
      <p class="muted">Снимите первый — он сразу ляжет в дневник.</p>
    </div>
  </section>

  <!-- Viewer -->
  <section id="viewer" class="viewer" hidden>
    <header class="viewer-top">
      <button id="viewerClose" class="icon-btn" aria-label="Закрыть">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="viewerMeta" class="viewer-meta"></div>
      <button id="viewerDelete" class="icon-btn" aria-label="Удалить">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>
      </button>
    </header>
    <div id="viewerStage" class="viewer-stage"><img id="viewerImg" alt=""></div>
    <div class="viewer-bottom">
      <textarea id="viewerNote" rows="2" placeholder="Заметка к кадру…"></textarea>
      <div class="viewer-actions">
        <button id="viewerShare" class="btn">Поделиться</button>
        <button id="viewerSave" class="btn ghost">Скачать</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
