<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Feeltr — плёночный дневник</title>
  <meta name="description" content="Фотодневник с плёночными фильтрами Nostalgic Neg., Monochrome +R и мультиэкспозицией.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Feeltr">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <!-- Camera -->
  <main id="camera" class="screen camera">
    <section id="viewfinder" class="viewfinder">
      <div class="frame" id="frame">
        <canvas id="preview"></canvas>
        <div id="mxBadge" class="mx-badge glass" hidden>ME 1/2</div>
        <button id="stillChip" class="still-chip glass" hidden>
          Фото из галереи
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
        <div id="flash" class="flash"></div>
      </div>
      <div id="vfMessage" class="vf-message glass" hidden>
        <svg class="vf-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3v10H4z"/><circle cx="12" cy="13" r="3.2"/></svg>
        <p id="vfText">Нужен доступ к камере</p>
        <div class="vf-actions">
          <button id="vfRetry" class="btn primary">Разрешить камеру</button>
          <button id="vfSystem" class="btn">Снять встроенной камерой</button>
          <button id="vfImport" class="btn">Выбрать фото</button>
          <button id="vfLive" class="link-btn">Включить живой видоискатель</button>
        </div>
      </div>
      <video id="video" playsinline muted autoplay></video>
    </section>

    <header class="cam-top">
      <button id="btnFormat" class="glass capsule mono" aria-label="Формат кадра">3:4</button>
      <div id="counter" class="glass capsule counter mono">FEELTR</div>
      <div class="glass capsule group">
        <button id="btnCamMode" class="icon-btn mode-btn" aria-pressed="false">
          <svg class="ic-live" viewBox="0 0 24 24"><path d="M4 9V6a2 2 0 0 1 2-2h3M15 4h3a2 2 0 0 1 2 2v3M20 15v3a2 2 0 0 1-2 2h-3M9 20H6a2 2 0 0 1-2-2v-3"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="ic-system" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="3"/><circle cx="12" cy="9" r="2.4"/><path d="M10.5 18h3"/></svg>
        </button>
        <button id="btnImport" class="icon-btn" aria-label="Взять фото из галереи">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 2.5-2.5L20 17"/></svg>
        </button>
        <button id="btnFlip" class="icon-btn" aria-label="Сменить камеру">
          <svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3v10H4z"/><path d="M9.2 13a3 3 0 0 1 5.3-1.7M14.8 13.4a3 3 0 0 1-5.3 1.6"/><path d="M14.7 9.8v1.7h-1.7M9.3 16.6v-1.7H11"/></svg>
        </button>
      </div>
    </header>

    <section id="mxPanel" class="mx-panel glass" hidden>
      <div class="segmented" id="modeSeg" role="radiogroup" aria-label="Режим совмещения" style="--n:3">
        <span class="seg-lens" aria-hidden="true"></span>
        <button data-mode="0" role="radio">Плёнка</button>
        <button data-mode="1" role="radio">Экран</button>
        <button data-mode="2" role="radio">Светлее</button>
      </div>
      <label class="mix">
        <span class="mono">I</span>
        <input id="mixRange" type="range" min="10" max="90" step="1" value="50" aria-label="Баланс экспозиций">
        <span class="mono">II</span>
      </label>
      <button id="mxReset" class="link-btn" hidden>Сбросить первый кадр</button>
    </section>

    <footer class="tray glass">
      <div class="segmented filters" id="filterSeg" role="radiogroup" aria-label="Плёнка" style="--n:2">
        <span class="seg-lens" aria-hidden="true"></span>
        <button class="filter-chip" data-filter="nn" role="radio"><span class="swatch nn"></span>Nostalgic Neg.</button>
        <button class="filter-chip" data-filter="mono" role="radio"><span class="swatch mono-sw"></span>Mono +R</button>
      </div>
      <div class="controls">
        <button id="btnDiary" class="thumb-btn" aria-label="Открыть дневник">
          <img id="lastThumb" alt="" hidden>
          <svg viewBox="0 0 24 24" id="diaryIcon"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 9h8M8 13h5"/></svg>
        </button>
        <button id="shutter" class="shutter" aria-label="Снять"><span></span></button>
        <button id="btnMx" class="mx-btn glass" aria-pressed="false" aria-label="Мультиэкспозиция">
          <svg viewBox="0 0 32 24"><circle cx="12" cy="12" r="7"/><circle cx="20" cy="12" r="7"/></svg>
        </button>
      </div>
    </footer>
    <input id="fileInput" type="file" accept="image/*" hidden>
    <input id="sysInput" type="file" accept="image/*" capture="environment" hidden>
  </main>

  <!-- Diary -->
  <section id="diary" class="screen diary" hidden>
    <div class="scroll-edge" aria-hidden="true"></div>
    <header class="nav">
      <button id="diaryBack" class="glass circle" aria-label="К камере">
        <svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
      </button>
      <div class="nav-title">Дневник</div>
      <button id="btnInstall" class="glass capsule" hidden>Установить</button>
    </header>
    <div id="diaryList" class="diary-scroll">
      <div class="large-title">
        <h1>Дневник</h1>
        <p id="diaryCount"></p>
      </div>
      <div id="iosTip" class="tip" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M7 11H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/></svg>
        <span>Чтобы установить Feeltr: «Поделиться» → «На экран „Домой“».</span>
        <button id="iosTipClose" aria-label="Закрыть">
          <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
      <div id="diaryDays"></div>
      <div id="diaryEmpty" class="empty" hidden>
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 32 24"><circle cx="12" cy="12" r="7"/><circle cx="20" cy="12" r="7"/></svg>
        </div>
        <p>Здесь будут ваши кадры</p>
        <p class="muted">Снимите первый — он сразу ляжет в дневник.</p>
      </div>
    </div>
  </section>

  <!-- Viewer -->
  <section id="viewer" class="viewer" hidden>
    <div id="viewerStage" class="viewer-stage"><img id="viewerImg" alt=""></div>
    <header class="viewer-top">
      <button id="viewerClose" class="glass circle" aria-label="Закрыть">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
      <div id="viewerMeta" class="viewer-meta glass capsule"></div>
      <button id="viewerDelete" class="glass circle" aria-label="Удалить">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>
      </button>
    </header>
    <div class="viewer-bottom glass">
      <textarea id="viewerNote" rows="2" placeholder="Заметка к кадру…"></textarea>
      <div class="viewer-actions">
        <button id="viewerShare" class="btn primary">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M7 11H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/></svg>
          Поделиться
        </button>
        <button id="viewerSave" class="btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M8 11l4 4 4-4M5 20h14"/></svg>
          Скачать
        </button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast glass" role="status" aria-live="polite"></div>
</body>
</html>
